name: Compilar FocoLeitura Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/compilar.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validar código JavaScript
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/pdf-compat.js
      - name: Testar limites e temporização dos estímulos
        run: node --test tests/effects.test.cjs
      - name: Validar troca de documentos
        run: node --test tests/import-flow.test.cjs
      - name: Compilar APK Android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FocoLeitura-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
