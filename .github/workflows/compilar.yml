name: Compilar FocoLeitura direto do ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          test -f FocoLeitura_2_Projeto_Android.zip || (echo "Arquivo FocoLeitura_2_Projeto_Android.zip não encontrado na raiz do repositório." && exit 1)
          mkdir -p projeto
          unzip -q FocoLeitura_2_Projeto_Android.zip -d projeto
          test -f projeto/settings.gradle.kts || (echo "O ZIP não contém o projeto Android esperado." && exit 1)

      - name: Aplicar correções do FocoLeitura 2.1
        run: |
          python3 scripts/apply_focoleitura_fixes.py projeto
          node --check projeto/app/src/main/assets/app.js

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK Android
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de depuração
        working-directory: projeto
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FocoLeitura-2-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
